[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "norwegian-fake-data"
version = "0.1.0"
description = "Norwegian fictional identifiers and character records for murder mystery games."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["norway", "fake-data", "cli", "murder-mystery", "rich"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Games/Entertainment",
]
dependencies = ["rich>=13.9,<15", "typer>=0.16,<1"]

[project.scripts]
norwegian-fake-data = "norwegian_fake_data.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "twine>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/norwegian_fake_data"]
# Keep metadata compatible with publishing tools; this package needs no 2.5 fields.
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
